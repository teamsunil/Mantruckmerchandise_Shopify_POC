<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MAN Merchandise UK – Store POC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1f2933; --anth:#303c49; --anth-2:#3d4a58; --red:#e40045; --red-ink:#fff;
  --steel:#7d8996; --line:#dde2e7; --surface:#ffffff; --page:#f2f4f6; --tile:#e9edf1;
  --muted:#5b6672; --ok:#1f7a4d; --ok-bg:#e3f3ea; --warn:#8a5a00; --warn-bg:#fdf1d8;
  --bad:#a1182f; --bad-bg:#fbe4e8; --info-bg:#e6eef7; --hdr:#ffffff;
  --sans:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --cond:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ink:#e7ecf1; --anth:#18202a; --anth-2:#222c37; --red:#ff2d63; --steel:#94a0ad; --line:#2f3a46;
    --surface:#1b232d; --page:#121820; --tile:#232d39; --muted:#a3aebb; --ok:#5fd39a; --ok-bg:#163527;
    --warn:#f2c46b; --warn-bg:#3a2e12; --bad:#ff8a9c; --bad-bg:#3b1820; --info-bg:#1c2b3c; --hdr:#1b232d;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ink:#e7ecf1; --anth:#18202a; --anth-2:#222c37; --red:#ff2d63; --steel:#94a0ad; --line:#2f3a46;
  --surface:#1b232d; --page:#121820; --tile:#232d39; --muted:#a3aebb; --ok:#5fd39a; --ok-bg:#163527;
  --warn:#f2c46b; --warn-bg:#3a2e12; --bad:#ff8a9c; --bad-bg:#3b1820; --info-bg:#1c2b3c; --hdr:#1b232d;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--page);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--anth)}
img,svg{max-width:100%}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding:0 20px}
h1,h2,h3{font-family:var(--cond);font-weight:700;line-height:1.1;margin:0 0 .4em;letter-spacing:.01em}
h1{font-size:clamp(2rem,4.5vw,3.4rem)}
h2{font-size:clamp(1.5rem,2.6vw,2.1rem)}
h3{font-size:1.25rem}
p{margin:0 0 1em}
.muted{color:var(--muted)}
.small{font-size:.875rem}

/* Demo bar + header */
.sticky{position:sticky;top:env(safe-area-inset-top,0px);z-index:50}
.demobar{background:var(--anth);color:#fff;font-size:.85rem}
.demobar .wrap{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding-top:6px;padding-bottom:6px}
.demobar select{background:var(--anth-2);color:#fff;border:1px solid #56636f;border-radius:3px;padding:3px 6px}
.demobar .tag{background:var(--red);color:#fff;padding:1px 8px;border-radius:2px;font-weight:600}
.demobar .sp{flex:1}
.demobar button{background:transparent;border:1px solid #6b7884;color:#fff;border-radius:3px;padding:3px 10px;cursor:pointer}
.demobar button:hover{border-color:#fff}
header.main{background:var(--hdr);border-bottom:1px solid var(--line)}
.hrow{display:flex;align-items:center;gap:20px;padding-top:14px;padding-bottom:14px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;cursor:pointer;background:none;border:0;padding:0}
.logo .mk{display:flex;align-items:center;justify-content:center;background:var(--anth);padding:5px 10px;border-radius:3px;height:48px}
.logo .mk img{height:38px;width:auto;display:block}
.logo .tx{font-family:var(--cond);font-weight:600;font-size:1.05rem;line-height:1.05;text-align:left}
.logo .tx span{display:block;color:var(--muted);font-weight:500;font-size:.85rem}
.search{flex:1;display:flex;max-width:520px}
.search input{flex:1;border:1px solid var(--line);border-right:0;background:var(--page);padding:9px 12px;border-radius:3px 0 0 3px;min-width:0}
.search button{border:0;background:var(--anth);color:#fff;padding:0 16px;border-radius:0 3px 3px 0;cursor:pointer}
:root[data-theme="dark"] .search button{background:#3d4a58}
.hicons{display:flex;gap:6px;margin-left:auto}
.hbtn{display:flex;align-items:center;gap:6px;background:none;border:1px solid transparent;padding:8px 10px;border-radius:3px;cursor:pointer;font-weight:500;white-space:nowrap}
.hbtn:hover{border-color:var(--line)}
.hbtn .count{background:var(--red);color:#fff;border-radius:10px;font-size:.75rem;padding:0 7px;font-weight:700}
nav.cats{border-top:1px solid var(--line);background:var(--hdr)}
nav.cats .wrap{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.cats button{background:none;border:0;border-bottom:3px solid transparent;padding:11px 12px;cursor:pointer;font-family:var(--cond);font-weight:600;font-size:1.05rem;white-space:nowrap;color:var(--ink)}
nav.cats button:hover,nav.cats button.on{border-bottom-color:var(--red)}
nav.cats button.dealer{color:var(--red)}
.notice{background:var(--info-bg);border-bottom:1px solid var(--line);font-size:.9rem}
.notice .wrap{padding-top:8px;padding-bottom:8px}
.notice .badge{margin-right:6px}
.linkbtn{background:none;border:0;padding:0;color:var(--red);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px}

/* Buttons & form */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--red);color:var(--red-ink);border:0;border-radius:3px;padding:11px 20px;font-weight:600;cursor:pointer;text-decoration:none;font-size:1rem}
.btn:hover{filter:brightness(.93)}
.btn.dark{background:var(--anth);color:#fff}
:root[data-theme="dark"] .btn.dark{background:#3d4a58}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:6px 12px;font-size:.875rem}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
label.f{display:block;margin-bottom:14px;font-weight:500;font-size:.92rem}
label.f input,label.f select,label.f textarea,.inp{display:block;width:100%;margin-top:5px;border:1px solid var(--line);background:var(--surface);padding:9px 11px;border-radius:3px}
.inp.n{width:90px;display:inline-block;margin:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:22px}
.badge{display:inline-block;font-size:.78rem;font-weight:600;padding:2px 8px;border-radius:2px;background:var(--tile);color:var(--ink);white-space:nowrap}
.badge.ok{background:var(--ok-bg);color:var(--ok)}
.badge.warn{background:var(--warn-bg);color:var(--warn)}
.badge.bad{background:var(--bad-bg);color:var(--bad)}
.badge.red{background:var(--red);color:#fff}
.badge.info{background:var(--info-bg)}

/* Home */
.hero{background:var(--anth);color:#fff;overflow:hidden}
.hero .wrap{display:grid;grid-template-columns:1.05fr 1fr;gap:30px;align-items:center;padding-top:48px;padding-bottom:0}
.hero h1{font-size:clamp(2.4rem,5.5vw,4.4rem);text-transform:none;max-width:12ch}
.hero p{color:#c9d2db;max-width:46ch;font-size:1.08rem}
.hero .acts{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:48px}
.hero .btn.ghost{color:#fff;border-color:#66727e}
.hero-art{align-self:end}
.road{height:14px;background:repeating-linear-gradient(90deg,#fff 0 40px,transparent 40px 80px);opacity:.25}
.usp{background:var(--surface);border-bottom:1px solid var(--line)}
.usp .wrap{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding-top:14px;padding-bottom:14px;font-size:.92rem}
.usp b{display:block;font-family:var(--cond);font-size:1.08rem}
section.blk{padding:44px 0}
.sechead{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.catgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.cat{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:0;cursor:pointer;text-align:left;overflow:hidden;display:flex;flex-direction:column}
.cat:hover{border-color:var(--steel)}
.cat .ci{background:var(--tile);aspect-ratio:16/10;display:flex;align-items:center;justify-content:center}
.cat .ci svg{width:62%;height:auto}
.cat .cn{padding:10px 14px;font-family:var(--cond);font-weight:600;font-size:1.15rem;display:flex;justify-content:space-between}
.cat .cn span{color:var(--muted);font-family:var(--sans);font-size:.85rem;font-weight:500}
.promo{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.promo>div{border-radius:4px;padding:28px;min-height:190px;display:flex;flex-direction:column;justify-content:end}
.promo .a{background:var(--red);color:#fff}
.promo .b{background:var(--surface);border:1px solid var(--line)}
.promo h3{font-size:1.8rem}

/* Product cards */
.pgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:4px;display:flex;flex-direction:column;overflow:hidden}
.card:hover{border-color:var(--steel)}
.card .im{background:var(--tile);aspect-ratio:1;display:block;border:0;padding:0;cursor:pointer;position:relative;width:100%}
.card .im svg{width:100%;height:100%;display:block}
.card .im .badge{position:absolute;left:10px;top:10px}
.card .bd{padding:12px 14px 14px;display:flex;flex-direction:column;gap:4px;flex:1}
.card .nm{font-weight:600;background:none;border:0;padding:0;text-align:left;cursor:pointer;line-height:1.3}
.card .nm:hover{text-decoration:underline}
.card .cl{font-size:.85rem;color:var(--muted)}
.price{font-family:var(--cond);font-weight:700;font-size:1.35rem}
.price s{color:var(--muted);font-weight:500;font-size:1rem;margin-left:6px}
.price .yp{color:var(--red)}
.stockline{font-size:.82rem}
.stockline.out{color:var(--bad)}
.stockline.in{color:var(--ok)}

/* Shop */
.shop{display:grid;grid-template-columns:240px 1fr;gap:24px;padding:28px 0 50px}
.filters{align-self:start}
.filters h3{font-size:1.05rem;margin-top:18px}
.filters h3:first-child{margin-top:0}
.fopt{display:flex;gap:8px;align-items:center;padding:3px 0;font-size:.93rem;cursor:pointer}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.crumbs{font-size:.88rem;color:var(--muted);margin:18px 0 0}
.crumbs button{background:none;border:0;padding:0;cursor:pointer;color:var(--muted);text-decoration:underline}
.empty{padding:40px;text-align:center}

/* PDP */
.pdp{display:grid;grid-template-columns:1.1fr 1fr;gap:36px;padding:20px 0 50px}
.pdp .gal{background:var(--tile);border-radius:4px;aspect-ratio:1}
.pdp .gal svg{width:100%;height:100%}
.sizes{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 16px}
.sz{min-width:52px;padding:9px 12px;border:1px solid var(--line);background:var(--surface);border-radius:3px;cursor:pointer;font-weight:600}
.sz.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.sz:disabled{text-decoration:line-through;color:var(--muted);cursor:not-allowed}
.swatches{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 16px}
.sw{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:3px;padding:5px 10px 5px 6px;background:var(--surface);cursor:pointer;font-size:.88rem}
.sw.on{border-color:var(--ink)}
.sw i{width:18px;height:18px;border-radius:50%;border:1px solid rgba(0,0,0,.2);display:inline-block}
.qty{display:inline-flex;border:1px solid var(--line);border-radius:3px;overflow:hidden}
.qty button{width:38px;border:0;background:var(--tile);cursor:pointer;font-size:1.1rem}
.qty input{width:56px;text-align:center;border:0;background:var(--surface);padding:8px 0}
.pricebox{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:16px;margin:14px 0}
.tiers{width:100%;border-collapse:collapse;font-size:.9rem;margin-top:8px}
.tiers td,.tiers th{border-top:1px solid var(--line);padding:6px 4px;text-align:left}
.tiers tr.cur td{font-weight:700}
.demo-note{font-size:.8rem;color:var(--warn);background:var(--warn-bg);padding:3px 8px;border-radius:2px;display:inline-block}

/* Cart / checkout */
.cartgrid{display:grid;grid-template-columns:1fr 360px;gap:24px;padding:28px 0 50px;align-items:start}
.cline{display:grid;grid-template-columns:84px 1fr auto;gap:14px;padding:16px 0;border-bottom:1px solid var(--line)}
.cline:first-child{padding-top:0}
.cline .th{background:var(--tile);border-radius:3px;aspect-ratio:1}
.cline .th svg{width:100%;height:100%}
.sizerow{display:flex;gap:10px;align-items:center;font-size:.92rem;margin-top:6px;flex-wrap:wrap}
.sizerow .qty button{width:30px}
.sizerow .qty input{width:44px;padding:4px 0}
.nudge{font-size:.85rem;background:var(--info-bg);padding:5px 9px;border-radius:2px;margin-top:8px;display:inline-block}
.sumrow{display:flex;justify-content:space-between;padding:5px 0}
.sumrow.tot{border-top:1px solid var(--line);margin-top:8px;padding-top:12px;font-family:var(--cond);font-weight:700;font-size:1.4rem}
.disc{color:var(--ok)}
.radio{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:3px;padding:12px;margin-bottom:8px;cursor:pointer}
.radio input{margin-top:4px}

/* Account / auth */
.auth{max-width:980px;margin:0 auto;padding:34px 0 60px;display:grid;grid-template-columns:1fr 1fr;gap:20px}
.demoacc{display:flex;flex-direction:column;gap:8px}
.demoacc button{display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;background:var(--surface);border:1px solid var(--line);padding:10px 12px;border-radius:3px;cursor:pointer}
.demoacc button:hover{border-color:var(--steel)}
.timeline{display:flex;gap:0;margin:12px 0 6px;flex-wrap:wrap}
.step{flex:1;min-width:110px;border-top:4px solid var(--line);padding-top:6px;font-size:.82rem;color:var(--muted)}
.step.done{border-top-color:var(--ok);color:var(--ink)}
.step b{display:block;font-size:.9rem}

/* Tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:4px;background:var(--surface)}
table.t{width:100%;border-collapse:collapse;font-size:.92rem}
table.t th{text-align:left;background:var(--tile);font-weight:600;padding:9px 12px;white-space:nowrap}
table.t td{padding:9px 12px;border-top:1px solid var(--line);vertical-align:middle}
table.t td.num,table.t th.num{text-align:right}

/* Admin */
.admin{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 40px)}
.aside{background:var(--anth);color:#fff;padding:20px 12px}
.aside .logo .mk{background:transparent;padding:0 4px 0 0}
.aside .logo .tx span{color:#aab5c0}
.aside nav{display:flex;flex-direction:column;gap:2px;margin-top:22px}
.aside nav button{background:none;border:0;color:#d2d9e0;text-align:left;padding:9px 12px;border-radius:3px;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.aside nav button:hover{background:var(--anth-2);color:#fff}
.aside nav button.on{background:var(--red);color:#fff}
.aside nav .grp{font-size:.78rem;color:#93a0ad;padding:14px 12px 4px}
.amain{padding:26px 28px 60px;min-width:0}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:14px 16px}
.kpi b{display:block;font-family:var(--cond);font-size:2rem;line-height:1.1}
.log{font-size:.85rem;max-height:260px;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:4px}
.log div{padding:7px 12px;border-top:1px solid var(--line);display:flex;gap:10px}
.log div:first-child{border-top:0}
.log time{color:var(--muted);white-space:nowrap}
.pending-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--warn);margin-right:6px;vertical-align:middle}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:18px}

/* Footer */
footer.site{background:var(--anth);color:#c3ccd5;margin-top:20px}
footer.site .wrap{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:20px;padding-top:36px;padding-bottom:36px;font-size:.92rem}
footer.site h3{color:#fff;font-size:1.1rem}
footer.site button{display:block;background:none;border:0;color:#c3ccd5;padding:3px 0;cursor:pointer;text-align:left}
footer.site button:hover{color:#fff;text-decoration:underline}

/* Modal / toast */
.modal{position:fixed;inset:0;background:rgba(10,15,20,.55);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal .box{background:var(--surface);border-radius:4px;max-width:560px;width:100%;max-height:90vh;overflow:auto;padding:24px}
.email{border:1px solid var(--line);border-radius:4px;overflow:hidden;margin-top:12px}
.email .eh{background:var(--anth);color:#fff;padding:12px 16px;font-family:var(--cond);font-weight:700;font-size:1.3rem}
.email .eb{padding:16px;font-size:.93rem}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--anth);color:#fff;padding:11px 18px;border-radius:3px;z-index:120;font-weight:500;max-width:90vw;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.notes h3{margin-top:22px}
.notes ul{padding-left:20px}

@media (max-width:980px){
  .pgrid{grid-template-columns:repeat(3,1fr)}
  .catgrid{grid-template-columns:repeat(2,1fr)}
  .shop{grid-template-columns:1fr}
  .cartgrid{grid-template-columns:1fr}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .admin{grid-template-columns:1fr}
  .aside nav{flex-direction:row;overflow-x:auto}
  .aside nav .grp{display:none}
  .aside nav button{white-space:nowrap}
  .cols2{grid-template-columns:1fr}
  footer.site .wrap{grid-template-columns:1fr 1fr}
}
@media (max-width:720px){
  .hero .wrap{grid-template-columns:1fr;padding-top:30px}
  .hero .acts{margin-bottom:10px}
  .pgrid{grid-template-columns:repeat(2,1fr);gap:10px}
  .pdp{grid-template-columns:1fr}
  .usp .wrap{grid-template-columns:1fr 1fr}
  .promo{grid-template-columns:1fr}
  .auth{grid-template-columns:1fr;padding-left:0;padding-right:0}
  .grid2{grid-template-columns:1fr}
  .hrow{flex-wrap:wrap;gap:10px}
  .sticky{position:static}
  .demobar .wrap{gap:8px}
  .demobar label,.demobar .hide-sm{display:none}
  .demobar select{max-width:58vw}
  .logo .mk{height:42px}
  .logo .mk img{height:32px}
  .search{order:3;max-width:none;flex-basis:100%}
  .hbtn .lbl{display:none}
  .amain{padding:18px 14px 50px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal-root"></div>

<script>
/* =========================================================
   MAN Merchandise UK – Shopify store proof of concept
   All data is simulated in the browser. No Shopify store,
   payment gateway, warehouse or email service is connected.

const $ = s => document.querySelector(s);

const r2 = n => Math.round(n*100)/100;
const gbp = n => '£' + (Math.round(n*100)/100).toFixed(2);

function group(u){ u = u===undefined ? me() : u; return u && u.status==='approved' ? u.group : 'public'; }
function pct(g, qty){ if(g==='public') return 0; const r=S.rules[g]; return qty>=r.threshold ? r.tier : r.base; }
function unitPrice(p, g, qty){ return r2(p.price*(1-pct(g,qty)/100)); }
function stockTotal(id){ const s=S.stock[id]||{}; return Object.values(s).reduce((a,b)=>a+b,0); }
function addLog(m){ S.log.unshift({t:new Date().toISOString(), m}); S.log = S.log.slice(0,80); }
function fmtTime(iso){ const d=new Date(iso); return d.toLocaleString('en-GB',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}); }
function fmtDate(iso){ const d=new Date(iso+'T12:00:00'); return d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}); }
function lightHex(h){ const n=parseInt(h.slice(1),16); const r=n>>16,g=(n>>8)&255,b=n&255; return (r*299+g*587+b*114)/1000 > 160; }
function toast(m){ const t=document.createElement('div'); t.className='toast'; t.setAttribute('role','status'); t.textContent=m; document.body.appendChild(t); setTimeout(()=>t.remove(),2600); }
function cartListingQty(pid){ return S.cart.filter(l=>l.pid===pid).reduce((a,l)=>a+l.qty,0); }
function cartCount(){ return S.cart.reduce((a,l)=>a+l.qty,0); }

/* Cart calculation – quantity thresholds per product listing, sizes combined */
function calcCart(lines, g){
  const byP = {};
  lines.forEach(l=>{ (byP[l.pid] = byP[l.pid] || []).push(l); });
  let retail=0, sub=0; const groups=[];
  Object.entries(byP).forEach(([pid, ls])=>{
    const p = prod(pid); if(!p) return;
    const q = ls.reduce((a,l)=>a+l.qty,0);
    const pc = pct(g,q); const u = unitPrice(p,g,q);
    retail += p.price*q; sub += u*q;
    groups.push({p, lines:ls, q, pc, unit:u, total:r2(u*q)});
  });
  retail=r2(retail); sub=r2(sub);
  return {groups, retail, sub, discount:r2(retail-sub)};
}
function delivFor(sub, method){ if(method==='next') return S.delivery.nextDay; return sub>=S.delivery.freeOver?0:S.delivery.standard; }

function preStatus(){
  const t = todayISO(0);
  if(t < S.pre.open) return {s:'upcoming', label:`Opens ${fmtDate(S.pre.open)}`};

  return {s:'open', label:`Open until ${fmtDate(S.pre.close)}`};
}

function render(){
  const r = currentRoute();
  const app = $('#app');
  let main;
  if(r==='home') main = pageHome();
  else if(r==='shop') main = pageShop();
  else if(r.startsWith('c-')) main = pageShop(r.slice(2));
  else if(r.startsWith('p-')) main = pageProduct(r);
  else if(r==='cart') main = pageCart();
  else if(r==='checkout') main = pageCheckout();
  else if(r==='confirmation') main = pageConfirmation();
  else if(r==='login') main = pageLogin();
  else if(r==='register') main = pageRegister();
  else if(r==='account') main = pageAccount();
  else if(r==='dealer-preorders') main = pageDealerPre();
  else main = pageHome();
  app.innerHTML = header() + `<main id="main">${main}</main>` + footer();
  document.title = 'MAN Merchandise UK – Store POC';
}

/* ---------- actions ---------- */
function signIn(u){
  S.session = u.id; addLog(`${u.name} signed in.`); save();
  const back = ui.returnTo; ui.returnTo=null;
  toast(`Signed in as ${u.name}`);
  go(back || (currentRoute()==='login'||currentRoute()==='register' ? 'home' : currentRoute()));
}
function setCartQty(pid, z, q){
  const l = S.cart.find(x=>x.pid===pid && x.size===z); if(!l) return;
  const max = (S.stock[pid]||{})[z]||0;
  q = Math.max(0, Math.min(q, max));
  if(q===0) S.cart = S.cart.filter(x=>x!==l); else l.qty=q;
  if(q===max && max>0) toast(`Only ${max} available in this size`);
  save(); render();
}
function syncStockSoon(pid){
  clearTimeout(syncStockSoon.t[pid]);
  syncStockSoon.t[pid] = setTimeout(()=>{
    S.stock[pid] = JSON.parse(JSON.stringify(S.wh[pid]));
    const p=prod(pid); addLog(`Stock feed: ${p?p.name+' – '+p.colour:pid} updated on website.`);
    save(); render();
  }, 1800);
}
syncStockSoon.t = {};
function placeOrder(f){
  const u = me(); const g = group(u); const c = calcCart(S.cart, g);
  for(const l of S.cart){ if(((S.stock[l.pid]||{})[l.size]||0) < l.qty){ toast('Some items are no longer in stock. Please review your basket.'); go('cart'); return; } }
  const m = ui.delivery||'standard'; const del = delivFor(c.sub, m);
  const o = {id:'MAN-'+(S.orderSeq++), userId:u.id, name:f.get('name'), email:u.email, group:g,
    address:[f.get('addr'),f.get('town'),f.get('pc')].join(', '),
    lines:c.groups.flatMap(gr=>gr.lines.map(l=>({pid:gr.p.id, name:gr.p.name, colour:gr.p.colour, size:l.size, qty:l.qty, unit:gr.unit}))),
    retail:c.retail, discount:c.discount, delivery:del, total:r2(c.sub+del), method:m,
    status:'Placed', placedAt:new Date().toISOString(), transferredAt:null, dispatchedAt:null, deliveredAt:null, tracking:null, carrier:null};
  S.cart.forEach(l=>{ S.stock[l.pid][l.size]-=l.qty; S.wh[l.pid][l.size]-=l.qty; });
  S.orders.unshift(o); S.cart=[]; ui.lastOrder=o.id; ui.delivery='standard';
  addLog(`Order ${o.id} placed by ${o.name} (${GROUP_LABEL[g]}), ${gbp(o.total)}.`);
  save(); go('confirmation');
  setTimeout(()=>transfer(o.id), 2200);
}
function transfer(id){
  const o = S.orders.find(x=>x.id===id); if(!o || o.status!=='Placed') return;
  o.status='Sent to warehouse'; o.transferredAt=new Date().toISOString();
  addLog(`Order ${o.id} transferred to warehouse.`); save(); render();
  setTimeout(()=>autoDispatch(id), 6000);
}
function dispatch(id){
  const o = S.orders.find(x=>x.id===id); if(!o) return;
  o.status='Dispatched'; o.dispatchedAt=new Date().toISOString();
  o.carrier = o.method==='next' ? 'DPD Next Day (demo)' : 'Royal Mail Tracked 48 (demo)';
  o.tracking = (o.method==='next'?'15501':'TT')+Math.floor(10000000+Math.random()*89999999)+(o.method==='next'?'':'GB');
  addLog(`Warehouse dispatched ${o.id}. Tracking ${o.tracking} sent back to the store; dispatch email sent to customer (simulated).`);
  save(); render(); toast(`${o.id} dispatched – tracking sent to customer`);
}

document.addEventListener('click', e=>{
  const stop = e.target.closest('[data-stop]');
  const a = e.target.closest('[data-act]'); if(!a) return;
  if(stop && a.dataset.act==='closeModal' && a.classList.contains('modal')) return;
  const d = a.dataset; const act = d.act;
  if(a.tagName==='BUTTON' && a.type!=='submit') e.preventDefault();
  switch(act){
    case 'go': if(d.to==='admin') ui.adminTab = ui.adminTab||'overview'; go(d.to); break;
    case 'clearFilters': Object.assign(ui,{cat:'all',q:'',source:'all',size:'all',instock:false,sort:'featured',maxPrice:100}); go('shop'); break;
    case 'pickSize': ui.sel[ui.pid]=d.z; render(); break;
    case 'pdpQty': ui.qty=Math.max(1,ui.qty+(+d.d)); render(); break;
    case 'addToCart': {
      const p=prod(ui.pid); const z=ui.sel[ui.pid]; if(!p||!z) return;
      const have=S.cart.find(l=>l.pid===p.id&&l.size===z); const max=S.stock[p.id][z]||0;
      const want=(have?have.qty:0)+ui.qty; const q=Math.min(want,max);
      if(have) have.qty=q; else S.cart.push({pid:p.id,size:z,qty:q});
      save(); render(); toast(want>max?`Added – limited to ${max} in stock`:`Added to basket: ${p.name}${p.sizes.length>1?' ('+z+')':''}`);
      break; }
    case 'cartQty': { const l=S.cart.find(x=>x.pid===d.pid&&x.size===d.z); if(l) setCartQty(d.pid,d.z,l.qty+(+d.d)); break; }
    case 'cartRemove': S.cart=S.cart.filter(x=>!(x.pid===d.pid&&x.size===d.z)); save(); render(); break;
    case 'checkout': if(!me()){ ui.returnTo='checkout'; ui.authMsg='Please sign in or create an account to check out.'; go('login'); } else go('checkout'); break;
    case 'quickLogin': signIn(S.customers.find(c=>c.id===d.id)); break;
    case 'logout': addLog(`${me().name} signed out.`); S.session=null; save(); toast('Signed out'); go('home'); break;
    case 'atab': ui.adminTab=d.k; render(); window.scrollTo(0,0); break;
    case 'approve': case 'reject': case 'revoke': {
      const c=S.customers.find(x=>x.id===d.id);
      if(act==='approve'){ c.status='approved'; c.group=c.requested; addLog(`${c.name} approved as ${GROUP_LABEL[c.requested]}.`); toast(`${c.name} approved – ${c.requested} pricing now active`); }
      if(act==='reject'){ c.status='rejected'; c.group='public'; addLog(`${c.name}'s ${c.requested} request rejected. Stays General Public.`); toast(`${c.name} stays on standard pricing`); }
      if(act==='revoke'){ c.status='pending'; c.group='public'; addLog(`${c.name} moved back to pending review.`); }
      save(); render(); break; }
    case 'dispatch': dispatch(d.id); break;
    case 'deliver': { const o=S.orders.find(x=>x.id===d.id); o.status='Delivered'; o.deliveredAt=new Date().toISOString(); addLog(`${o.id} delivered (carrier update, simulated).`); save(); render(); break; }
    case 'failTransfer': { const o=S.orders.find(x=>x.id===d.id); o.status='Transfer failed'; addLog(`Alert: ${o.id} failed to transfer to the warehouse. Flagged for review.`); save(); render(); toast(`${o.id} flagged – transfer failed`); break; }
    case 'retryTransfer': { const o=S.orders.find(x=>x.id===d.id); o.status='Placed'; addLog(`Retrying transfer for ${o.id}.`); save(); render(); setTimeout(()=>transfer(o.id),1200); break; }
    case 'emailPreview': { const o=S.orders.find(x=>x.id===d.id); if(o) modal(emailHTML(o,d.kind)); break; }
    case 'goodsIn': S.products.filter(p=>p.cat===ui.whCat).forEach(p=>{ p.sizes.forEach(z=>{ S.wh[p.id]=S.wh[p.id]||{}; S.wh[p.id][z]=(S.wh[p.id][z]||0)+20; }); syncStockSoon(p.id); });
      addLog(`Warehouse goods-in: +20 per size for ${catName(ui.whCat)}.`); save(); render(); break;
    case 'copyCsv': {
      const sizes=[...ADULT,'One size']; const cons={}; PRE_PRODUCTS.forEach(pp=>cons[pp.id]={});
      S.pre.orders.forEach(o=>Object.entries(o.items).forEach(([pid,zs])=>Object.entries(zs).forEach(([z,q])=>{cons[pid][z]=(cons[pid][z]||0)+q;})));
      const csv=['Product,Colour,'+sizes.join(',')+',Total'].concat(PRE_PRODUCTS.map(pp=>{ const v=sizes.map(z=>cons[pp.id][z]||0); return `"${pp.name}",${pp.colour},${v.join(',')},${v.reduce((a,b)=>a+b,0)}`; })).join('\n');
      (navigator.clipboard?navigator.clipboard.writeText(csv):Promise.reject()).then(()=>toast('Report copied – paste into Excel')).catch(()=>modal(`<h2>Consolidated report (CSV)</h2><textarea class="inp" rows="8" readonly>${esc(csv)}</textarea>`));
      break; }
    case 'releasePre': addLog('Pre-order collection marked for release to the main store once stock is received (simulated).'); save(); toast('Release scheduled – products will go live when stock is booked in'); render(); break;
    case 'resetDemo': if(confirm('Reset all demo data? Orders, accounts and settings return to the starting sample.')){ S=defaultState(); save(); ui.adminTab='overview'; toast('Demo data reset'); render(); } break;
    case 'info': { const [t,f]=INFO[d.k]; modal(`<h2>${t}</h2>${f()}`); break; }
    case 'closeModal': if(e.target===a || a.tagName==='BUTTON') $('#modal-root').innerHTML=''; break;
    case 'noop': toast('Tracking link (simulated)'); break;
  }
});

document.addEventListener('change', e=>{
  const el = e.target; const k = el.dataset.change; if(!k) return; const d = el.dataset;
  switch(k){
    case 'switchUser': S.session = el.value || null; save(); ui.pre={}; toast(el.value?`Now viewing as ${me().name}`:'Now viewing as a guest'); if(currentRoute()==='admin') render(); else render(); break;
    case 'filter': {
      let v = el.type==='checkbox' ? el.checked : el.value;
      if(d.k==='maxPrice') v=+v;
      ui[d.k]=v;
      if(d.k==='cat'){ ui.keepCat=true; go(v==='all'?'shop':'c-'+v); } else render();
      break; }
    case 'pdpQtySet': ui.qty=Math.max(1,parseInt(el.value)||1); render(); break;
    case 'cartQtySet': setCartQty(d.pid,d.z,parseInt(el.value)||0); break;
    case 'delivery': ui.delivery=el.value; render(); break;
    case 'regType': ui.regType=el.value; { const f=el.form; const keep={fn:f.fn.value,ln:f.ln.value,email:f.email.value}; render(); const nf=$('form[data-submit="register"]'); Object.entries(keep).forEach(([n,v])=>nf[n].value=v); } break;
    case 'rule': { const v=Math.max(0,parseInt(el.value)||0); S.rules[d.g][d.k] = d.k==='threshold'?Math.max(2,v):Math.min(90,v); addLog(`Pricing rule updated: ${GROUP_LABEL[d.g]} ${d.k} = ${S.rules[d.g][d.k]}.`); save(); render(); toast('Pricing updated – storefront prices refresh immediately'); break; }
    case 'deliv': S.delivery[d.k]=Math.max(0,parseFloat(el.value)||0); save(); render(); break;
    case 'pxp': ui.pxp=el.value; render(); break;
    case 'pxq': ui.pxq=Math.max(1,parseInt(el.value)||1); render(); break;
    case 'setGroup': { const c=S.customers.find(x=>x.id===d.id); c.group=el.value; c.status='approved'; if(el.value!=='public') c.requested=el.value; addLog(`${c.name} moved to ${GROUP_LABEL[el.value]} by admin.`); save(); render(); break; }
    case 'setPrice': { const p=prod(d.id); p.price=Math.max(0.5,r2(parseFloat(el.value)||p.price)); addLog(`Price changed: ${p.name} – ${p.colour} now ${gbp(p.price)}.`); save(); render(); break; }
    case 'setActive': { const p=prod(d.id); p.active=el.checked; addLog(`${p.name} – ${p.colour} ${p.active?'published':'hidden'}.`); save(); render(); break; }
    case 'whCat': ui.whCat=el.value; render(); break;
    case 'whQty': { S.wh[d.pid][d.z]=Math.max(0,parseInt(el.value)||0); const p=prod(d.pid); addLog(`Warehouse stock changed: ${p.name} – ${p.colour} ${d.z} = ${S.wh[d.pid][d.z]}.`); save(); render(); syncStockSoon(d.pid); break; }
    case 'preQty': { ui.pre=ui.pre||{}; ui.pre[d.pid]=ui.pre[d.pid]||{}; ui.pre[d.pid][d.z]=Math.max(0,parseInt(el.value)||0); render(); break; }
    case 'preSet': S.pre[d.k]=el.value; addLog(`Pre-order ${d.k} updated.`); save(); render(); break;
  }
});

document.addEventListener('submit', e=>{
  const f = e.target; const k = f.dataset.submit; if(!k) return; e.preventDefault();
  const fd = new FormData(f);
  switch(k){
    case 'search': ui.q=(fd.get('q')||'').trim(); ui.cat='all'; ui.keepCat=true; go('shop'); break;
    case 'login': {
      const u=S.customers.find(c=>c.email.toLowerCase()===String(fd.get('email')).toLowerCase().trim() && c.pw===fd.get('pw'));
      if(!u){ ui.authMsg='Email or password not recognised. Try a demo account on the right.'; render(); return; }
      signIn(u); break; }
    case 'register': {
      const email=String(fd.get('email')).trim();
      if(S.customers.some(c=>c.email.toLowerCase()===email.toLowerCase())){ toast('An account with this email already exists. Sign in instead.'); return; }
      const req=fd.get('req');
      const c={id:'c'+Date.now(), name:(fd.get('fn')+' '+fd.get('ln')).trim(), email, pw:fd.get('pw'), requested:req, group:'public', status:req==='public'?'approved':'pending', ref:fd.get('ref')||'', company:fd.get('company')||'', created:todayISO(0)};
      S.customers.push(c);
      addLog(`New account: ${c.name} (${req==='public'?'General Public':'requested '+req+' – pending approval'}).`);
      ui.regType='public';
      signIn(c);
      if(req!=='public') setTimeout(()=>toast('Account created. Standard pricing applies until WW verifies your status.'),2700);
      break; }
    case 'placeOrder': placeOrder(fd); break;
    case 'preOrder': {
      const u=me(); let units=0, value=0; const items={};
      PRE_PRODUCTS.forEach(pp=>{ const zs=(ui.pre||{})[pp.id]||{}; const q=Object.values(zs).reduce((a,b)=>a+b,0); if(q){ items[pp.id]={}; Object.entries(zs).forEach(([z,n])=>{ if(n) items[pp.id][z]=n; }); units+=q; value+=q*pp.price*(1-pct('dealer',q)/100); } });
      if(!units) return;
      const o={id:'PRE-'+(2001+S.pre.orders.length), userId:u.id, dealer:u.company||u.name, at:new Date().toISOString(), items, units, value:r2(value)};
      S.pre.orders.unshift(o); ui.pre={}; addLog(`Dealer pre-order ${o.id} submitted by ${o.dealer}: ${units} units.`); save(); render(); toast(`Pre-order ${o.id} submitted`); break; }
    case 'addProduct': {
      const name=fd.get('name').trim(), colour=fd.get('colour').trim();
      const slug=(name+'-'+colour).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
      let id='p-'+slug; let n=2; while(prod(id)) id='p-'+slug+'-'+(n++);
      const sizes={adult:ADULT,kids:KIDS,one:ONE}[fd.get('sizes')];
      const p={id, family:name.toLowerCase().replace(/[^a-z0-9]+/g,'-'), name, colour, hex:fd.get('hex'), cat:fd.get('cat'), source:fd.get('source'), type:fd.get('type'), price:r2(+fd.get('price')), sizes, desc:fd.get('desc'), featured:false, active:true};
      S.products.push(p); S.stock[id]={}; S.wh[id]={}; sizes.forEach(z=>{S.stock[id][z]=0; S.wh[id][z]=0;});
      addLog(`Product added: ${name} – ${colour}.`); save(); render(); toast('Product added – book stock in via the warehouse feed'); break; }
  }
});
document.addEventListener('keydown', e=>{ if(e.key==='Escape') $('#modal-root').innerHTML=''; });

/* resume any orders still waiting for transfer after a reload */
function autoDispatch(id){ const o=S.orders.find(x=>x.id===id); if(o && o.status==='Sent to warehouse') dispatch(id); }
S.orders.filter(o=>o.status==='Placed').forEach(o=>setTimeout(()=>transfer(o.id),1500));
S.orders.filter(o=>o.status==='Sent to warehouse').forEach(o=>setTimeout(()=>autoDispatch(o.id),4000));
Object.keys(S.wh).forEach(pid=>{ if(JSON.stringify(S.wh[pid])!==JSON.stringify(S.stock[pid])) syncStockSoon(pid); });
render();
</script>
